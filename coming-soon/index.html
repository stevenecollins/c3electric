<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="C3 Electrical Contracting - Professional electrical services coming soon. Residential, Commercial, New Construction, and Service Calls."
		/>
		<title>C3 Electrical Contracting | Coming Soon</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					"Helvetica Neue", Arial, sans-serif;
				background: linear-gradient(
					135deg,
					#1a1a1a 0%,
					#2d2462 50%,
					#1a1a1a 100%
				);
				color: #ffffff;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 20px;
				line-height: 1.6;
			}

			.container {
				max-width: 900px;
				width: 100%;
				text-align: center;
			}

			.header {
				margin-bottom: 2rem;
			}

			.company-name {
				font-size: 3rem;
				font-weight: 900;
				letter-spacing: 2px;
				color: #ffffff;
				margin-bottom: 1rem;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
			}

			.coming-soon {
				font-size: 2.5rem;
				font-weight: 700;
				color: #d29bdc;
				margin-bottom: 1rem;
				text-transform: uppercase;
				letter-spacing: 3px;
			}

			.subtitle {
				font-size: 1.2rem;
				color: #e0e0e0;
				margin-bottom: 2rem;
				font-weight: 300;
			}

			.services {
				font-size: 1.1rem;
				color: #ffffff;
				letter-spacing: 2px;
				margin-bottom: 3rem;
				padding: 1rem 0;
				border-top: 2px solid rgba(255, 255, 255, 0.3);
				border-bottom: 2px solid rgba(255, 255, 255, 0.3);
			}

			.contact-section {
				background-color: rgba(255, 255, 255, 0.9);
				backdrop-filter: blur(10px);
				padding: 2.5rem;
				border-radius: 10px;
				margin-bottom: 2rem;
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
				margin: auto;
				max-width: 500px;
			}

			.contact-title {
				font-size: 1.5rem;
				margin-bottom: 1.5rem;
				color: #d29bdc;
				font-weight: 600;
				background-color: #2d2462;
			}

			.contact-info {
				display: flex;
				flex-direction: column;
				gap: 1rem;
				align-items: center;
			}

			.contact-item {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
			}

			.contact-link {
				font-size: 1.5rem;
				color: #000;
				text-decoration: none;
				font-weight: 600;
				transition: color 0.3s ease;
			}

			.contact-link:hover {
				color: #d29bdc;
			}

			.icon {
				font-size: 1.5rem;
			}

			.footer {
				margin-top: 3rem;
				padding-top: 2rem;
				border-top: 1px solid rgba(255, 255, 255, 0.2);
			}

			.tagline {
				font-size: 1.3rem;
				font-style: italic;
				color: #e0e0e0;
				margin-bottom: 0.5rem;
			}

			.copyright {
				font-size: 0.9rem;
				color: #999;
			}

			/* Responsive Design */
			@media screen and (max-width: 768px) {
				.company-name {
					font-size: 2rem;
					letter-spacing: 1px;
				}

				.coming-soon {
					font-size: 1.8rem;
					letter-spacing: 2px;
				}

				.subtitle {
					font-size: 1rem;
				}

				.services {
					font-size: 0.9rem;
					letter-spacing: 1px;
				}

				.contact-section {
					padding: 1.5rem;
				}

				.contact-link {
					font-size: 1.2rem;
				}

				.tagline {
					font-size: 1.1rem;
				}
			}

			@media screen and (max-width: 480px) {
				.company-name {
					font-size: 1.5rem;
				}

				.coming-soon {
					font-size: 1.5rem;
				}

				.services {
					font-size: 0.8rem;
				}

				.contact-link {
					font-size: 1.1rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1 class="company-name">C3 ELECTRICAL CONTRACTING</h1>
				<div class="coming-soon">Coming Soon</div>
				<p class="subtitle">Our new website is launching soon</p>
			</div>

			<div class="services">
				RESIDENTIAL | COMMERCIAL | NEW CONSTRUCTION | SERVICE CALLS
			</div>

			<div class="contact-section">
				<h2 class="contact-title">Need Electrical Services Now?</h2>
				<div class="contact-info">
					<div class="contact-item">
						<span class="icon">📞</span>
						<a href="tel:+19104061076" class="contact-link">(910) 406-1076</a>
					</div>
					<div class="contact-item">
						<span class="icon">✉️</span>
						<a
							href="mailto:C3ElectricalContracting@gmail.com"
							class="contact-link"
							>C3ElectricalContracting@gmail.com</a
						>
					</div>
				</div>
			</div>

			<div class="footer">
				<p class="tagline">"Power To The People"</p>
				<p class="copyright">
					&copy; 2025 C3 Electrical Contracting. All rights reserved.
				</p>
			</div>
		</div>
	</body>
</html>
